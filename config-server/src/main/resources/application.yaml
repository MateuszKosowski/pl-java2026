server:
  port: 8888

spring:
  application:
    name: config-server

  security:
    user:
      name: ${CONFIG_SERVER_USER}
      password: ${CONFIG_SERVER_PASSWORD}

  cloud:
    config:
      server:
        git:
          uri: https://github.com/bkolacinski/pl-java2026-config.git
          default-label: main
        native:
          search-locations: classpath:/config/