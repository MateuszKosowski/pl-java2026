<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="StegoCloud API Documentation" />
        <title>StegoCloud API Docs</title>
        <link
            rel="stylesheet"
            href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
        />
        <link
            rel="shortcut icon"
            href="https://fastapi.tiangolo.com/img/favicon.png"
        />
        <style>
            html {
                box-sizing: border-box;
                overflow: -moz-scrollbars-vertical;
                overflow-y: scroll;
            }
            *,
            *:before,
            *:after {
                box-sizing: inherit;
            }
            body {
                margin: 0;
                background: #fafafa;
            }
        </style>
    </head>
    <body>
        <div id="swagger-ui"></div>
        <script
            src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"
            crossorigin
        ></script>
        <script
            src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"
            crossorigin
        ></script>
        <script>
            window.onload = () => {
                window.ui = SwaggerUIBundle({
                    url: "stegocloud-openapi.json",
                    dom_id: "#swagger-ui",
                    deepLinking: true,
                    presets: [
                        SwaggerUIBundle.presets.apis,
                        SwaggerUIStandalonePreset,
                    ],
                    layout: "BaseLayout",
                });
            };
        </script>
    </body>
</html>
