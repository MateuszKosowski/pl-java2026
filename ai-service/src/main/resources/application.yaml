spring:
  application:
    name: ai-service
  config:
    import: "optional:configserver:http://localhost:8888"

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

ai:
  model:
    path: ${AI_MODEL_PATH:/app/model/mobilenetv2.onnx}
